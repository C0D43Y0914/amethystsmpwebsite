<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amethyst SMP | Admin</title>
<style>
:root{color-scheme:dark;--bg:#0c0912;--panel:#171020;--purple:#b68cff;--pink:#e5c5ff;--muted:#b8adca;--line:#ffffff20}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#49266b55,transparent 55%),var(--bg);color:#f8f3ff;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(650px,100%);background:linear-gradient(145deg,#20162d,#130e1b);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 25px 90px #0006}h1{margin:0 0 6px;font-size:30px}.muted{color:var(--muted)}label{display:block;margin:15px 0 6px;font-size:14px;font-weight:700}input,textarea{width:100%;border:1px solid var(--line);background:#0c0912;color:#fff;padding:12px;border-radius:10px;font:inherit}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#d8baff,#a979ed);color:#21132e;margin-top:18px}.secondary{background:#ffffff12;color:#fff;border:1px solid var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}.status{margin-top:14px;padding:12px;border-radius:10px;background:#ffffff0a;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}.warn{font-size:13px;color:#f4d8a4}.top{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
</style></head>
<body><main class="panel">
<div class="top"><div><h1>◆ Amethyst SMP Admin</h1><div class="muted">Manage public server information</div></div><button id="signout" class="btn secondary hidden" type="button">Sign out</button></div>
<p class="warn">Sign in with the owner account you created in Supabase Authentication. Database policies must restrict writes to your owner account; the page alone is not a security boundary.</p>
<section id="login">
<label for="email">Owner email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="login-btn" class="btn" type="button">Sign in</button>
</section>
<section id="editor" class="hidden">
<label for="server_name">Server name</label><input id="server_name" maxlength="100" value="Amethyst SMP">
<label for="server_ip">Server IP</label><input id="server_ip" maxlength="255" placeholder="play.example.net">
<label for="discord_url">Discord invite URL</label><input id="discord_url" type="url" maxlength="500" placeholder="https://discord.gg/yourinvite">
<label for="description">Public description</label><textarea id="description" maxlength="2000"></textarea>
<label><input id="published" type="checkbox" style="width:auto;margin-right:8px"> Publish these details on the public website</label>
<div class="row"><button id="save-btn" class="btn" type="button">Save changes</button><button id="reload-btn" class="btn secondary" type="button">Reload data</button></div>
</section><div id="status" class="status" role="status">Ready.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://keyycxbkfwgcjkaagakv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_YvUzYh2pr4PMjVlStfh2yw_fD6Mc3ep';
const db=(window.supabase && !SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);
function status(msg){$('status').textContent=msg}
function showSession(session){const yes=!!session;$('login').classList.toggle('hidden',yes);$('editor').classList.toggle('hidden',!yes);$('signout').classList.toggle('hidden',!yes);}
async function loadData(){if(!db)return status('Setup required: paste your Supabase publishable key into this file.');const {data,error}=await db.from('server_info').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();if(error)return status('Could not load settings: '+error.message);if(!data)return status('No server_info row found.');$('server_name').value=data.server_name||'';$('server_ip').value=data.server_ip||'';$('discord_url').value=data.discord_url||'';$('description').value=data.description||'';$('published').checked=!!data.published;status('Settings loaded.');}
async function refresh(){if(!db)return status('Setup required: paste your Supabase publishable key into this file.');const {data:{session},error}=await db.auth.getSession();if(error)status(error.message);showSession(session);if(session)await loadData();}
$('login-btn').addEventListener('click',async()=>{if(!db)return status('Setup required: paste your Supabase publishable key into this file.');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return status('Sign-in failed: '+error.message);showSession(data.session);await loadData();});
$('signout').addEventListener('click',async()=>{await db.auth.signOut();showSession(null);status('Signed out.');});
$('reload-btn').addEventListener('click',loadData);
$('save-btn').addEventListener('click',async()=>{if(!db)return status('Setup required: paste your Supabase publishable key into this file.');const {data:{user}}=await db.auth.getUser();if(!user)return status('Please sign in again.');const payload={server_name:$('server_name').value.trim(),server_ip:$('server_ip').value.trim(),discord_url:$('discord_url').value.trim(),description:$('description').value.trim(),published:$('published').checked,updated_at:new Date().toISOString()};if(payload.discord_url&&!/^https:\/\/(discord\.gg|discord\.com\/invite)\//i.test(payload.discord_url))return status('Enter a valid https://discord.gg/... or https://discord.com/invite/... invite.');const {data:existing,error:readError}=await db.from('server_info').select('id').order('updated_at',{ascending:false}).limit(1).maybeSingle();if(readError)return status('Could not check existing settings: '+readError.message);let result;if(existing)result=await db.from('server_info').update(payload).eq('id',existing.id).select().single();else result=await db.from('server_info').insert(payload).select().single();if(result.error)return status('Save failed (check owner-only RLS policies): '+result.error.message);status('Saved successfully. Refresh the public website to see published changes.');});
if(db)db.auth.onAuthStateChange((_event,session)=>showSession(session));
refresh();
</script></body></html>
